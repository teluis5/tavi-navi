name: Refresh transit timetable
on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: transit-timetable-update
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and validate timetables
        run: python scripts/update-transit.py
      - name: Commit and publish updated data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/transit/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: refresh transit timetable'
          git pull --rebase origin main
          git push origin HEAD:main
          gh workflow run deploy.yml --ref main
