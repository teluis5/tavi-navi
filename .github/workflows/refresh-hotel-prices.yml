name: Refresh hotel prices (monthly)
on:
  schedule:
    # 毎月1日 午前9:00 JST (00:00 UTC)
    - cron: '0 0 1 * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: hotel-prices-update
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh hotel prices
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
        run: python scripts/update-hotel-prices.py
      - name: Commit and publish updated hotel data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/hotel-prices/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: refresh monthly hotel prices'
          git pull --rebase origin main
          git push origin HEAD:main
          gh workflow run deploy.yml --ref main
