<title id="map-title">横浜花博へのアクセス模式路線図</title>
      <desc id="map-desc">花博会場を中心に、瀬谷・三ツ境・十日市場・南町田グランベリーパークの４駅からのシャトルバス、主要鉄道路線、東京の主要駅と空港、東海道新幹線、京急線、羽田空港と横浜駅間のバスを示す模式図。実際の距離や経路を正確に表すものではありません。</desc>
